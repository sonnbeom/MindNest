spring:
  application:
    name: mindnest-api

llm:
  anthropic:
    api-key: ${LLM_API_KEY}
    base-url: https://api.anthropic.com/v1
    version: 2023-06-01
    model: claude-haiku-4-5-20251001
    temperature: 0.3
    max-tokens: 2000
    prompt:
      distortion-analysis: prompts/archive/archive/distortion_analysis_v3.md
      intake-analysis: prompts/intake_analysis.md
      reframe-generation: prompts/reframe_generation.md

cors:
  allowed-origins: http://localhost:3000,http://localhost:3001

feedback:
  file-path: /mnt/c/Project/MindNest/mindnest-api/feedback/distortion_analysis.jsonl
